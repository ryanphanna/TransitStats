name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build && cd functions && npm ci --include=optional && cd ..
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Deploy Functions
        # NOTE: The service account in FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4
        # must have at minimum the following IAM roles on the project:
        #   - roles/firebase.admin   (recommended)
        #   or
        #   - roles/cloudfunctions.developer
        #   - roles/firebase.functions.developer
        #   - roles/datastore.user   (required to avoid 403 when accessing Firestore during deploy)
        #
        # The 403 error on firestore.googleapis.com during "firebase deploy --only functions"
        # is almost always caused by missing datastore.user (or broader firebase.admin) on the SA.
        run: |
          set -uo pipefail
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4 }}' > /tmp/sa.json
          npm install -g firebase-tools
          for attempt in 1 2 3; do
            echo "Deploying Functions (attempt $attempt/3)"
            if GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only functions --project transitstats-21ba4 2>&1 | tee /tmp/functions_out.txt; then
              exit 0
            fi

            if ! grep -Eq 'HTTP Error: (409|429)|Quota exceeded|unable to queue the operation' /tmp/functions_out.txt; then
              echo "Functions deploy failed for a non-transient reason."
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Functions deploy still hit a transient Firebase quota/queue error after 3 attempts."
              exit 1
            fi

            delay=$((attempt * 60))
            echo "Firebase is temporarily throttling function updates; retrying in ${delay}s."
            sleep "$delay"
          done
      - name: Deploy Hosting
        # Firebase returns 400 FAILED_PRECONDITION when the build output is
        # identical to the already-live version (e.g. only function code changed).
        # That's a false-positive failure — the site is already up to date.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only hosting:main --project transitstats-21ba4 2>&1 | tee /tmp/hosting_out.txt; EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ] && grep -q "current active version" /tmp/hosting_out.txt; then
            echo "Hosting already up to date, skipping."
            exit 0
          fi
          exit $EXIT
      - name: Verify deployed build
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          for URL in "https://transitstats.fyi/?build=$EXPECTED_BUILD"; do
            echo "Checking $URL"
            curl --fail --silent --show-error --location "$URL" -o /tmp/main.html
            grep -Fq "name=\"transitstats-build\" content=\"$EXPECTED_BUILD\"" /tmp/main.html
          done
