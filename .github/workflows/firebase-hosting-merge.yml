name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && cd functions && npm ci --include=optional && cd ..
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Deploy Functions
        # NOTE: The service account in FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4
        # must have at minimum the following IAM roles on the project:
        #   - roles/firebase.admin   (recommended)
        #   or
        #   - roles/cloudfunctions.developer
        #   - roles/firebase.functions.developer
        #   - roles/datastore.user   (required to avoid 403 when accessing Firestore during deploy)
        #
        # The 403 error on firestore.googleapis.com during "firebase deploy --only functions"
        # is almost always caused by missing datastore.user (or broader firebase.admin) on the SA.
        env:
          ML_ALLOWED_USER_IDS: ${{ secrets.ML_ALLOWED_USER_IDS }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4 }}
        run: |
          set -uo pipefail
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          # Users who get ML predictions. Kept out of the repo; empty or unset means ML is off
          # (the deploy still succeeds and predictions use the rule-based engine).
          if [ -n "${ML_ALLOWED_USER_IDS:-}" ]; then
            printf 'ML_ALLOWED_USER_IDS=%s\n' "$ML_ALLOWED_USER_IDS" > functions/.env.transitstats-21ba4
          fi
          npm install -g firebase-tools
          for attempt in 1 2 3; do
            echo "Deploying Functions (attempt $attempt/3)"
            if GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" firebase deploy --only functions --project transitstats-21ba4 2>&1 | tee /tmp/functions_out.txt; then
              exit 0
            fi

            if ! grep -Eq 'HTTP Error: (409|429)|Quota exceeded|unable to queue the operation' /tmp/functions_out.txt; then
              echo "Functions deploy failed for a non-transient reason."
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Functions deploy still hit a transient Firebase quota/queue error after 3 attempts."
              exit 1
            fi

            delay=$((attempt * 60))
            echo "Firebase is temporarily throttling function updates; retrying in ${delay}s."
            sleep "$delay"
          done
      - name: Deploy Hosting
        # Firebase returns 400 FAILED_PRECONDITION when the build output is
        # identical to the already-live version (e.g. only function code changed).
        # That's a false-positive failure — the site is already up to date.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BUILD_SHA: ${{ github.sha }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4 }}
        run: |
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" firebase deploy --only hosting:main --project transitstats-21ba4 2>&1 | tee /tmp/hosting_out.txt; EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ] && grep -q "current active version" /tmp/hosting_out.txt; then
            echo "Hosting already up to date, skipping."
            exit 0
          fi
          exit $EXIT
      - name: Verify deployed build
        env:
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          set -uo pipefail
          URL="https://transitstats.fyi/?build=$EXPECTED_BUILD"
          # A single request can hit a transient error or a stale edge copy even
          # though the deploy succeeded, so retry before failing.
          for attempt in 1 2 3 4 5 6; do
            echo "Checking $URL (attempt $attempt/6)"
            if curl --fail --silent --show-error --location "$URL" -o /tmp/main.html \
              && grep -Fq "name=\"transitstats-build\" content=\"$EXPECTED_BUILD\"" /tmp/main.html; then
              echo "Deployed build verified."
              exit 0
            fi
            [ "$attempt" -lt 6 ] && sleep 10
          done
          echo "Deployed build $EXPECTED_BUILD was not served after 6 attempts."
          exit 1

  # Separate job so a rules problem never blocks the functions/hosting deploy,
  # and rules only ship after the rules tests pass.
  deploy_firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - run: npm install
      - run: npm run test:rules
      - name: Deploy Firestore and Storage rules and indexes
        # The service account needs roles/firebase.admin, or at minimum
        # roles/firebaserules.admin (rules) and roles/datastore.indexAdmin (indexes).
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4 }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" firebase deploy --only firestore,storage --project transitstats-21ba4
