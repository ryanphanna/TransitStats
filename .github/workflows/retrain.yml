name: Weekly Model Retrain

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 4 AM UTC
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Export trips and the stops library from Firestore
        env:
          TRANSITSTATS_PROJECT_ID: transitstats-21ba4
          # Only these users' trips are ever used for training (set as a repository secret).
          TRAIN_USER_IDS: ${{ secrets.TRAIN_USER_IDS }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4 }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          GRPC_DNS_RESOLVER=native python3 ml/export_trips.py
          # The training scripts and the gate read the stops library from this file: the key only
          # exists inside this step. Same shape as train_endstop.load_stops_library().
          python3 - <<'EOF'
          import json, os, firebase_admin
          from firebase_admin import credentials, firestore
          firebase_admin.initialize_app(credentials.Certificate(os.environ["GOOGLE_APPLICATION_CREDENTIALS"]), {"projectId": "transitstats-21ba4"})
          lib = [{"name": d.get("name"), "aliases": d.get("aliases", [])}
                 for d in (doc.to_dict() for doc in firestore.client().collection("stops").stream())]
          json.dump(lib, open(os.path.join(os.environ["RUNNER_TEMP"], "stops.json"), "w"))
          print(f"Stops library: {len(lib)} stops")
          EOF

      - name: Retrain end-stop models (V4 + V5)
        run: |
          set -euo pipefail
          python3 ml/train_endstop.py --stops-json "$RUNNER_TEMP/stops.json"

      # Route models are not gated (they are being removed); they still train and upload as before.
      - name: Retrain route models (V4 + V5)
        run: |
          set -euo pipefail
          STOPS_JSON="$RUNNER_TEMP/stops.json" python3 ml/train_routes.py

      - name: Choose the model version
        id: version
        run: echo "version=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      # End-stop gate (ml/eval_gate.py, EVAL.md "Retrain gate v1"): walk-forward on a fixed fold
      # calendar, paired against the published set's eval_rows.json. Any non-zero exit (rejected = 1,
      # error = 2) fails the job here, so nothing below runs: no upload, models/latest.json untouched.
      - name: End-stop retrain gate
        env:
          TRAIN_USER_IDS: ${{ secrets.TRAIN_USER_IDS }}
          EVAL_ROW_SALT: ${{ secrets.EVAL_ROW_SALT }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4 }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          python3 ml/eval_gate.py --csv ml/trips.csv --stops-json "$RUNNER_TEMP/stops.json" \
            --candidate-dir ml --out ml/eval_rows.json --version "${{ steps.version.outputs.version }}" \
            --fetch-published

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Upload models to private storage
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4 }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_KEY" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # eval_rows.json is next week's paired baseline; the pointer is written last.
          node functions/scripts/upload-models.js --dir ml --require-eval-rows --version "${{ steps.version.outputs.version }}"

      - name: Append retrain results to MODEL_LOG
        run: |
          python3 - <<'EOF'
          import json, datetime, pathlib

          es_v4 = json.loads(pathlib.Path("ml/model_v4_endstop_meta.json").read_text())
          es_v5 = json.loads(pathlib.Path("ml/model_v5_endstop_meta.json").read_text())
          rt_v4 = json.loads(pathlib.Path("ml/model_v4_meta.json").read_text())
          rt_v5 = json.loads(pathlib.Path("ml/model_v5_meta.json").read_text())
          date = datetime.date.today().isoformat()

          entry_lines = [
              f"## Auto-retrain — {date}",
              "",
              "### End-Stop Models",
              "",
              "| Model | Top-1 | Top-3 | Classes | Trips |",
              "|---|---|---|---|---|",
              f"| V5 XGBoost | {es_v5['top1_accuracy']:.1%} | {es_v5['top3_accuracy']:.1%} | {len(es_v5['classes'])} | {es_v5['n_trips']} |",
              f"| V4 LogReg  | {es_v4['top1_accuracy']:.1%} | {es_v4['top3_accuracy']:.1%} | {len(es_v4['classes'])} | {es_v4['n_trips']} |",
              "",
              "### Route Models",
              "",
              "| Model | Top-1 | Top-3 | Classes | Trips |",
              "|---|---|---|---|---|",
              f"| V5 XGBoost | {rt_v5['top1_accuracy']:.1%} | {rt_v5['top3_accuracy']:.1%} | {len(rt_v5['classes'])} | {rt_v5['n_trips']} |",
              f"| V4 LogReg  | {rt_v4['top1_accuracy']:.1%} | {rt_v4['top3_accuracy']:.1%} | {len(rt_v4['classes'])} | {rt_v4['n_trips']} |",
              "",
              "---",
              "",
          ]
          entry = "\n".join(entry_lines)

          log = pathlib.Path("ml/MODEL_LOG.md")
          content = log.read_text()
          insert_at = content.index("---\n") + 4
          log.write_text(content[:insert_at] + "\n" + entry + content[insert_at:])
          print(f"Appended retrain entry for {date} to MODEL_LOG.md")
          EOF

      - name: Prepare model update branch
        id: model_changes
        env:
          MODEL_BRANCH: automation/weekly-model-retrain-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$MODEL_BRANCH"
          git add ml/MODEL_LOG.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No log changes to publish."
            exit 0
          fi
          git commit -m "chore: weekly model retrain log"
          git push origin "$MODEL_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open model update pull request
        if: steps.model_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_BRANCH: automation/weekly-model-retrain-${{ github.run_id }}
        run: |
          gh pr create \
            --base main \
            --head "$MODEL_BRANCH" \
            --title "chore: weekly model retrain log" \
            --body "The weekly retrain passed the regression gate and the new models are already in private storage (the functions pick them up within an hour). This PR only records the accuracy log."
