name: Weekly Model Retrain

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 4 AM UTC
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Write service account key
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSITSTATS_21BA4 }}
        run: |
          mkdir -p "$HOME/Desktop/Dev/Credentials"
          echo "$FIREBASE_KEY" > "$HOME/Desktop/Dev/Credentials/Firebase for Transit Stats.json"
          cp "$HOME/Desktop/Dev/Credentials/Firebase for Transit Stats.json" "${{ github.workspace }}/../service-account.json"

      - name: Save current model metrics
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/../service-account.json
        run: |
          mkdir -p /tmp/transitstats-model-baseline
          python3 - <<'EOF'
          import json, os, firebase_admin
          from firebase_admin import credentials, storage
          key = os.path.expanduser("~/Desktop/Dev/Credentials/Firebase for Transit Stats.json")
          firebase_admin.initialize_app(credentials.Certificate(key), {"projectId": "transitstats-21ba4"})
          bucket = storage.bucket(os.environ.get("ML_MODEL_BUCKET") or "transitstats-21ba4.firebasestorage.app")
          pointer = bucket.blob("models/latest.json")
          if not pointer.exists():
              print("No published models yet (first run): skipping baseline")
          else:
              version = json.loads(pointer.download_as_bytes())["version"]
              for name in ["model_v4_meta.json", "model_v4_endstop_meta.json", "model_v5_meta.json", "model_v5_endstop_meta.json"]:
                  bucket.blob(f"models/{version}/{name}").download_to_filename("/tmp/transitstats-model-baseline/" + name)
          EOF

      - name: Export trips from Firestore
        env:
          TRANSITSTATS_PROJECT_ID: transitstats-21ba4
          # Only these users' trips are ever used for training (set as a repository secret).
          TRAIN_USER_IDS: ${{ secrets.TRAIN_USER_IDS }}
        run: GRPC_DNS_RESOLVER=native python3 ml/export_trips.py

      - name: Retrain end-stop models (V4 + V5)
        run: GRPC_DNS_RESOLVER=native python3 ml/train_endstop.py

      - name: Retrain route models (V4 + V5)
        run: GRPC_DNS_RESOLVER=native python3 ml/train_routes.py

      - name: Reject material model regressions
        run: python3 ml/check_model_regression.py --baseline-dir /tmp/transitstats-model-baseline --candidate-dir ml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Upload models to private storage
        run: node functions/scripts/upload-models.js --dir ml
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/../service-account.json

      - name: Append retrain results to MODEL_LOG
        run: |
          python3 - <<'EOF'
          import json, datetime, pathlib

          es_v4 = json.loads(pathlib.Path("ml/model_v4_endstop_meta.json").read_text())
          es_v5 = json.loads(pathlib.Path("ml/model_v5_endstop_meta.json").read_text())
          rt_v4 = json.loads(pathlib.Path("ml/model_v4_meta.json").read_text())
          rt_v5 = json.loads(pathlib.Path("ml/model_v5_meta.json").read_text())
          date = datetime.date.today().isoformat()

          entry_lines = [
              f"## Auto-retrain — {date}",
              "",
              "### End-Stop Models",
              "",
              "| Model | Top-1 | Top-3 | Classes | Trips |",
              "|---|---|---|---|---|",
              f"| V5 XGBoost | {es_v5['top1_accuracy']:.1%} | {es_v5['top3_accuracy']:.1%} | {len(es_v5['classes'])} | {es_v5['n_trips']} |",
              f"| V4 LogReg  | {es_v4['top1_accuracy']:.1%} | {es_v4['top3_accuracy']:.1%} | {len(es_v4['classes'])} | {es_v4['n_trips']} |",
              "",
              "### Route Models",
              "",
              "| Model | Top-1 | Top-3 | Classes | Trips |",
              "|---|---|---|---|---|",
              f"| V5 XGBoost | {rt_v5['top1_accuracy']:.1%} | {rt_v5['top3_accuracy']:.1%} | {len(rt_v5['classes'])} | {rt_v5['n_trips']} |",
              f"| V4 LogReg  | {rt_v4['top1_accuracy']:.1%} | {rt_v4['top3_accuracy']:.1%} | {len(rt_v4['classes'])} | {rt_v4['n_trips']} |",
              "",
              "---",
              "",
          ]
          entry = "\n".join(entry_lines)

          log = pathlib.Path("ml/MODEL_LOG.md")
          content = log.read_text()
          insert_at = content.index("---\n") + 4
          log.write_text(content[:insert_at] + "\n" + entry + content[insert_at:])
          print(f"Appended retrain entry for {date} to MODEL_LOG.md")
          EOF

      - name: Prepare model update branch
        id: model_changes
        env:
          MODEL_BRANCH: automation/weekly-model-retrain-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --create "$MODEL_BRANCH"
          git add ml/MODEL_LOG.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No log changes to publish."
            exit 0
          fi
          git commit -m "chore: weekly model retrain log"
          git push origin "$MODEL_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open model update pull request
        if: steps.model_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_BRANCH: automation/weekly-model-retrain-${{ github.run_id }}
        run: |
          gh pr create \
            --base main \
            --head "$MODEL_BRANCH" \
            --title "chore: weekly model retrain log" \
            --body "The weekly retrain passed the regression gate and the new models are already in private storage (the functions pick them up within an hour). This PR only records the accuracy log."
