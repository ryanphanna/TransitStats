<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — TransitStats</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main id="app-root">
        <section class="view leaderboard-view active">
            <div class="leaderboard-page-container">
                <div class="leaderboard-page-heading">
                    <p class="leaderboard-kicker">TransitStats</p>
                    <h1>Leaderboard</h1>
                    <p>See who has logged the most completed rides.</p>
                </div>
                <div id="leaderboard-content" class="leaderboard-page-card" aria-live="polite">
                    <p class="leaderboard-status">Loading leaderboard…</p>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="/js/pages/leaderboard.js"></script>
</body>
</html>
