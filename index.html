<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitStats — Your transit life, mapped.</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <meta name="description" content="Log your transit life by text, then see every ride mapped and explained.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <!-- Google Analytics 4: anonymous product-usage measurement only. Skipped for internal sessions
         (localhost, ?ts_internal=1, or the ts.internal-test flag). Keep identical across pages (tests/ga-internal.test.js). -->
    <script>
        (function () {
            var ID = 'G-Z8L60LPC8G', internal = false, flagged = false;
            try {
                var h = location.hostname, q = new URLSearchParams(location.search);
                flagged = q.get('ts_internal') === '1';
                if (flagged) localStorage.setItem('ts.internal-test', '1');
                internal = h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h === '::1' || flagged || localStorage.getItem('ts.internal-test') === '1';
                if (q.has('ts_internal')) {
                    q.delete('ts_internal');
                    var s = q.toString();
                    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
                }
            } catch (e) { internal = internal || flagged; }
            if (internal) { window['ga-disable-' + ID] = true; return; }
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { dataLayer.push(arguments); };
            gtag('js', new Date());
            gtag('config', ID);
            var el = document.createElement('script');
            el.async = true;
            el.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
            document.head.appendChild(el);
        })();
    </script>
</head>
<body>
    <main id="app-root">
        <section id="view-auth" class="view auth-view active">
            <!-- Same logo position, size and spacing as the signed-in header (js/shared/header.js). -->
            <header class="auth-header">
                <div class="header-container">
                    <a href="/" class="logo" aria-label="TransitStats home">
                        <div class="logo-icon"><i data-lucide="zap"></i></div>
                        <span class="logo-text">TransitStats</span>
                    </a>
                </div>
            </header>

            <div class="auth-content">
                <div class="auth-copy">
                    <h1 class="auth-title">Your transit life, <em>mapped.</em></h1>
                    <p class="auth-subtitle">Log your trips and see where you ride.</p>
                </div>

                <div class="auth-card card">
                    <div class="auth-card-heading">
                        <div>
                            <h2 id="auth-heading">Get started or log in</h2>
                        </div>
                    </div>

                    <div class="auth-step-frame">
                            <div id="auth-phone-step">
                            <label class="sr-only" for="auth-phone">Phone number</label>
                        <div class="auth-input-wrap" id="auth-phone-wrap">
                                <i data-lucide="smartphone" aria-hidden="true"></i>
                                <input type="tel" id="auth-phone" inputmode="tel" autocomplete="tel" placeholder="Phone number">
                            </div>
                            <button id="btn-auth-request-code" class="btn btn-primary full-width">Text me a code <i data-lucide="arrow-right" aria-hidden="true"></i></button>
                            <button id="btn-auth-email-mode" class="btn btn-link full-width hidden" type="button">Use email instead</button>
                        </div>

                        <div id="auth-email-step" class="hidden">
                            <label class="sr-only" for="auth-email">Email address</label>
                            <div class="auth-input-wrap">
                                <i data-lucide="mail" aria-hidden="true"></i>
                                <input type="email" id="auth-email" autocomplete="email" placeholder="Email address">
                            </div>
                            <label class="sr-only" for="auth-password">Password</label>
                            <div class="auth-input-wrap">
                                <i data-lucide="key-round" aria-hidden="true"></i>
                                <input type="password" id="auth-password" autocomplete="current-password" placeholder="Password">
                            </div>
                            <button id="btn-auth-email-login" class="btn btn-primary full-width" type="button">Log in with email <i data-lucide="arrow-right" aria-hidden="true"></i></button>
                            <button id="btn-auth-reset-password" class="btn btn-link full-width" type="button">Send password reset email</button>
                            <button id="btn-auth-phone-mode" class="btn btn-link full-width" type="button">Use phone instead</button>
                        </div>

                        <div id="auth-code-step" class="hidden">
                            <label class="sr-only" for="auth-code">Verification code</label>
                            <div class="auth-code-wrap">
                                <input type="text" id="auth-code" class="auth-code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
                                <button id="btn-auth-resend-code" class="btn btn-link" type="button">Resend code</button>
                            </div>
                            <button id="btn-auth-verify-code" class="btn btn-primary full-width" disabled>Continue <i data-lucide="arrow-right" aria-hidden="true"></i></button>
                            <button id="btn-auth-change-number" class="btn btn-link full-width" type="button">Wrong number? Change it</button>
                        </div>
                    </div>

                    <div id="auth-turnstile" class="auth-turnstile"></div>
                    <div id="auth-status" class="status-msg hidden" role="status" aria-live="polite"></div>
                </div>

                <p class="auth-invite-note"><i data-lucide="lock-keyhole" aria-hidden="true"></i> Invite-only for now.</p>
            </div>

            <div class="auth-legal-links">
                <a href="/terms">Terms</a>
                <span aria-hidden="true">·</span>
                <a href="/privacy">Privacy</a>
            </div>

            <div class="auth-visual" aria-hidden="true">
                <div class="auth-visual-grid"></div>
                <svg class="auth-route-map" viewBox="0 0 760 900" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="auth-route auth-route-gold" pathLength="1" d="M-80 640C95 600 110 405 270 415C410 424 382 690 560 655C695 629 625 380 840 290" stroke="#f8c84b" stroke-width="14" stroke-linecap="round"/>
                    <path class="auth-route auth-route-blue" pathLength="1" d="M40 120C178 214 176 350 310 350C462 350 485 166 720 116" stroke="#4a6cf7" stroke-width="11" stroke-linecap="round"/>
                    <path class="auth-route auth-route-red" pathLength="1" d="M158 940C228 815 338 785 342 618C347 456 527 465 616 352C679 272 637 170 790 38" stroke="#ee6a52" stroke-width="10" stroke-linecap="round"/>
                    <path class="auth-route auth-route-green" pathLength="1" d="M-40 270C120 260 164 510 316 514C469 518 472 767 808 760" stroke="#3bb58a" stroke-width="9" stroke-linecap="round"/>
                    <g class="auth-station">
                        <circle cx="270" cy="415" r="7"/><circle cx="342" cy="618" r="7"/><circle cx="485" cy="166" r="7"/>
                        <circle cx="560" cy="655" r="7"/><circle cx="316" cy="514" r="7"/>
                    </g>
                    <g class="auth-route-dots" fill="#17213d">
                        <circle cx="119" cy="610" r="4"/><circle cx="205" cy="406" r="4"/><circle cx="430" cy="353" r="4"/><circle cx="636" cy="352" r="4"/><circle cx="530" cy="760" r="4"/>
                    </g>
                </svg>
                <div class="auth-visual-caption">
                    <span class="auth-live-dot"></span>
                    <span>Your city, in motion.</span>
                </div>
                <div class="auth-stat-card auth-stat-card-top"><strong>Every ride</strong><span>mapped here</span></div>
                <div class="auth-stat-card auth-stat-card-bottom"><span>Local favourite</span><strong id="auth-featured-line">Line 2 · Bloor–Danforth</strong></div>
            </div>
        </section>
    </main>

    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
