<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Analytics 4: anonymous product-usage measurement only. Skipped for internal sessions
         (localhost, ?ts_internal=1, or the ts.internal-test flag). Keep identical across pages (tests/ga-internal.test.js). -->
    <script>
        (function () {
            var ID = 'G-Z8L60LPC8G', internal = false, flagged = false;
            try {
                var h = location.hostname, q = new URLSearchParams(location.search);
                flagged = q.get('ts_internal') === '1';
                if (flagged) localStorage.setItem('ts.internal-test', '1');
                internal = h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h === '::1' || flagged || localStorage.getItem('ts.internal-test') === '1';
                if (q.has('ts_internal')) {
                    q.delete('ts_internal');
                    var s = q.toString();
                    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
                }
            } catch (e) { internal = internal || flagged; }
            if (internal) { window['ga-disable-' + ID] = true; return; }
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { dataLayer.push(arguments); };
            gtag('js', new Date());
            gtag('config', ID);
            var el = document.createElement('script');
            el.async = true;
            el.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
            document.head.appendChild(el);
        })();
    </script>
    <title>TransitStats — Wrapped</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/pages/wrapped.css">
</head>
<body class="wrapped-surface">
    <main id="app-root">
        <section class="wrapped-view" aria-labelledby="wrapped-title">
            <div class="wrapped-panel">
                <div class="wrapped-panel-top">
                    <h1 id="wrapped-title">Transit Wrapped</h1>
                    <p class="wrapped-lede">Last month's rides on a transfer ticket you can share. <span id="wrapped-deadline"></span></p>
                </div>

                <div class="wrapped-perf" aria-hidden="true"></div>
                <div class="wrapped-panel-bottom">
                    <p id="wrapped-status" class="wrapped-status">Checking your sign-in…</p>

                    <div id="wrapped-actions" class="wrapped-actions" data-state="none">
                        <button id="wrapped-print" class="wrapped-btn wrapped-btn-primary wrapped-print" type="button" disabled>Print transfer</button>
                        <button id="wrapped-download" class="wrapped-btn wrapped-btn-primary wrapped-download" type="button" tabindex="-1">Download PNG</button>
                        <button id="wrapped-share" class="wrapped-btn wrapped-btn-secondary wrapped-share" type="button" tabindex="-1">Share</button>
                    </div>
                    <button id="wrapped-reprint" class="wrapped-reprint" type="button">Print again</button>
                </div>
            </div>

            <div id="wrapped-stage" class="wrapped-stage" hidden>
                <div class="wrapped-printer">
                    <div class="wrapped-housing" aria-hidden="true"><span class="wrapped-slot"></span><span class="wrapped-light"></span></div>
                    <div class="wrapped-feed">
                        <canvas id="wrapped-preview" class="wrapped-preview" width="470" height="870" aria-label="Wrapped ticket preview"></canvas>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="js/pages/wrapped.js"></script>
</body>
</html>
