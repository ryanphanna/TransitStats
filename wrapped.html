<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitStats — Wrapped</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/pages/wrapped.css">
</head>
<body class="wrapped-surface">
    <main id="app-root">
        <section class="wrapped-view" aria-labelledby="wrapped-title">
            <div class="wrapped-panel">
                <p class="wrapped-brand">transitstats</p>
                <h1 id="wrapped-title">Transit Wrapped</h1>
                <p class="wrapped-lede">One month of rides on a transfer ticket you can share.</p>

                <div class="wrapped-perf" aria-hidden="true"></div>
                <label class="wrapped-month-label" for="wrapped-month">Month</label>
                <select id="wrapped-month" class="wrapped-month" aria-describedby="wrapped-status"></select>
                <p id="wrapped-status" class="wrapped-status">Loading your trips…</p>

                <div class="wrapped-actions">
                    <button id="wrapped-download" class="wrapped-btn wrapped-btn-primary" type="button" disabled>Download PNG</button>
                    <button id="wrapped-share" class="wrapped-btn wrapped-btn-secondary" type="button" disabled>Share</button>
                </div>
            </div>

            <div id="wrapped-empty" class="wrapped-empty" hidden>
                <p>No trips in this month yet.</p>
            </div>

            <div id="wrapped-stage" class="wrapped-stage" hidden>
                <canvas id="wrapped-preview" class="wrapped-preview" width="540" height="960" aria-label="Wrapped card preview"></canvas>
            </div>
        </section>
    </main>
    <script type="module" src="js/pages/wrapped.js"></script>
</body>
</html>
